<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentSense Offline</title>
    <style>
        body {
            font-family: Inter, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
            color: #14213d;
            padding: 1.5rem;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 16px 40px rgba(20, 33, 61, 0.08);
            text-align: center;
        }
        h1 { margin-bottom: 0.6rem; }
        p { color: #5f6f8f; line-height: 1.7; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You’re offline</h1>
        <p>StudentSense is currently offline, but the app shell is available. Please reconnect to view the latest content.</p>
    </div>
</body>
</html>
