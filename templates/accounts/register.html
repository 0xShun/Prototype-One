{% extends 'base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Create your account</h2>
    <p>Set up your StudentSense profile and begin your first check-in.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
</div>
{% endblock %}
