{% extends 'base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Welcome back</h2>
    <p>Sign in to continue your student support journey.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
